<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22313a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EDSP – ESPACE TRANSPORT · Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#1c2429;--mute:#5d6b73;--line:#d9ded9;--road:#22313a;--sun:#f2b705;--ok:#1d7a58;--bad:#b9382b;--warn:#b7791f;--okbg:#dff1e8;--badbg:#f8e0dc;--warnbg:#fbefd2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191d;--card:#1b252b;--ink:#eaeeea;--mute:#98a7af;--line:#2d3b43;--road:#0d1316;--okbg:#17372b;--badbg:#412320;--warnbg:#3d3016;--ok:#55c595;--bad:#ef8b7f;--warn:#e8b64d}}
:root[data-theme="dark"]{--bg:#12191d;--card:#1b252b;--ink:#eaeeea;--mute:#98a7af;--line:#2d3b43;--road:#0d1316;--okbg:#17372b;--badbg:#412320;--warnbg:#3d3016;--ok:#55c595;--bad:#ef8b7f;--warn:#e8b64d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding-bottom:84px}
header{background:var(--road);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font-size:16px;font-weight:800}
.sub{font-size:11px;letter-spacing:.14em;color:#b9c6cc;font-weight:600;margin-top:2px}
.brand h1 span{color:var(--sun)}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--sun);color:#1c2429;font-weight:600}
.roles{display:flex;gap:6px;margin-top:10px}
.roles button{flex:1;border:1px solid #ffffff40;background:transparent;color:#fff;padding:8px 2px;border-radius:10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.roles button.on{background:#fff;color:#1c2429;border-color:#fff}
.net{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#cfd8dc}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;color:inherit;font:inherit}
.sw i{width:34px;height:20px;border-radius:99px;background:#5d6b73;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--ok)}.sw.on i:after{left:16px}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.hero{background:var(--road);color:#fff;border:0}
.hero .big{font-family:"Bricolage Grotesque",sans-serif;font-size:38px;font-weight:800;line-height:1.05}
.hero small{color:#b9c6cc}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}
.veh{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.veh:last-child{border:0}
.plate{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;background:#fff;color:#1c2429;border:2px solid #1c2429;border-radius:6px;padding:2px 8px;font-size:13px;white-space:nowrap}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--road);color:#fff}
.btn.sun{background:var(--sun);color:#1c2429}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 2px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--sun)}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px}.b{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.b i{display:block;background:var(--sun);border-radius:4px 4px 0 0}.meter{height:6px;border-radius:3px;background:var(--line);margin-bottom:8px}.meter div{height:6px;border-radius:3px;background:var(--sun)}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--road);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90%}
.sheet{display:none}.sheet.open{display:block}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div><h1>EDSP – <span>ESPACE TRANSPORT</span></h1><div class="sub">TRANSPORT MANAGER</div></div><span class="pill">Prototype</span></div>
  <div class="roles" id="roles"></div>
  <div class="net"><span id="netlbl"></span><button class="sw on" id="sw" aria-label="Basculer hors connexion"><span>Connecté</span><i></i></button></div>
</header>
<main id="main"></main>
</div>
<nav><div id="nav"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const fmt=n=>Math.round(n).toLocaleString("fr-FR")+" FCFA";
const LN={gbaka:["Yopougon – Adjamé","Abobo – Adjamé"],woro:["Cocody – Riviera","Cocody – Angré"]};
const S={maint:[{v:"Yaris 7710 BD 01",k:"Vidange",st:"planifie"}],req:true,role:"signup",tab:"form",ttype:"vtc",prof:"owner",done:false,validator:"",online:true,pending:0,
 contract:{mode:"fixe",val:15000},
 mission:false,trips:6,status:"brouillon",note:"",
 entries:[{t:"recette",l:"Courses du jour",a:50000},{t:"carburant",l:"Carburant",a:10000},{t:"depense",l:"Lavage et pièces",a:3000}]};
const vehicles=[
 {p:"5821 GH 01",m:"Toyota Corolla",ty:"vtc",d:"Kouassi Yao",s:"ok",st:"En service",doc:"Assurance valide jusqu’au 03/2027"},
 {p:"2204 KL 01",m:"Hyundai H100",ty:"gbaka",ln:"Yopougon – Adjamé",d:"Non affecté",s:"warn",st:"Disponible",doc:"Visite technique à renouveler sous 12 jours"},
 {p:"7710 BD 01",m:"Toyota Yaris",ty:"taxi",d:"Traoré Ibrahim",s:"bad",st:"En maintenance",doc:"Vidange en cours, remise en circulation à valider"},
 {p:"3398 TX 01",m:"Toyota Corolla",ty:"woro",ln:"Cocody – Riviera",d:"Non affecté",s:"warn",st:"Disponible",doc:"Carte grise valide"}];
const TT={vtc:{n:"VTC",line:false,i:"Sans ligne : circule partout dans la zone de service."},taxi:{n:"Taxi",line:false,i:"Sans ligne : circule partout, prise en charge à la demande."},gbaka:{n:"Gbaka",line:true,i:"Ligne fixe (exemple) : Yopougon – Adjamé. Limites : arrêts et terminus de la ligne."},woro:{n:"Wôrô-wôrô",line:true,i:"Ligne fixe (exemple) : Cocody – Riviera. Limites : commune de Cocody."}};
const dayLeft=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const docs=[{n:"Visite technique",d:dayLeft(3)},{n:"Assurance",d:dayLeft(140)},{n:"Carte grise",d:dayLeft(300)}];
const left=d=>Math.ceil((d-new Date())/864e5);
const docCard=()=>{const al=docs.filter(x=>left(x.d)<=5);return `<div class="card"${al.length?' style="border-color:var(--warn)"':""}><h3>Documents du véhicule</h3>${al.length?`<p class="note" style="margin:0 0 6px;color:var(--warn)"><b>Rappel :</b> ${al.map(x=>x.n).join(", ")} à renouveler.</p>`:""}${docs.map(x=>{const j=left(x.d);return `<div class="row"><span>${x.n}<br><small class="note">échéance le ${x.d.toLocaleDateString("fr-FR")}</small></span><span class="tag ${j<=5?"t-warn":"t-ok"}">${j<=5?"Dans "+j+" j":"Valide"}</span></div>`}).join("")}<p class="note">Un rappel apparaît 5 jours avant chaque échéance.</p></div>`};
const typeCard=()=>`<div class="card"><h3>Type de transport</h3><select id="tt" aria-label="Type de transport">${Object.keys(TT).map(k=>`<option value="${k}" ${S.ttype===k?"selected":""}>${TT[k].n}</option>`).join("")}</select><p class="note">${TT[S.ttype].line?"Ligne fixe : "+(vehicles.find(x=>x.ty===S.ttype)||{}).ln+". Limites : arrêts et terminus de la ligne.":TT[S.ttype].i}</p>${TT[S.ttype].line?'<p class="note">Proposition : un trajet hors des limites de la ligne est signalé au propriétaire.</p>':""}</div>`;
function ownOf(n){return S.contract.mode==="fixe"?Math.min(S.contract.val,Math.max(n,0)):Math.max(n,0)*S.contract.val/100}
function catOf(l){const k=l.split(" – ")[0];return /Essence|Gasoil|Carburant/.test(k)?"Carburant":/Lavage/.test(k)?"Lavage":/Péage/.test(k)?"Péage":/Parking/.test(k)?"Parking":/Crédit/.test(k)?"Crédit téléphonique":/pneu/i.test(k)?"Réparation pneu":"Autres"}
function rep(){const c=calc();
 const wk=[["Jeu",38000,8000,2000],["Ven",52000,11000,3500],["Sam",61000,13000,2000],["Dim",29000,6000,1000],["Lun",44000,9500,2500],["Mar",47000,10000,4000],["Auj.",c.rec,c.car,c.dep]];
 const mx=Math.max(...wk.map(x=>x[1]),1),rec=wk.reduce((a,x)=>a+x[1],0),dep=wk.reduce((a,x)=>a+x[2]+x[3],0),due=wk.reduce((a,x)=>a+ownOf(x[1]-x[2]-x[3]),0);
 const cat={"Carburant":57500,"Lavage":4000,"Péage":3500,"Parking":2000,"Crédit téléphonique":1500,"Réparation pneu":3000,"Autres":1000};
 S.entries.filter(e=>e.t!=="recette").forEach(e=>cat[catOf(e.l)]+=e.a);
 const cs=Object.entries(cat).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),cm=cs[0][1];
 const yDue=4*ownOf(14000),recT=rec+96000,depT=dep+40000;
 return `<div class="card hero"><small>7 derniers jours · tous véhicules</small><div class="big">${fmt(recT-depT)}</div><small>résultat après dépenses</small></div>
<div class="card"><h3>Bilan de la semaine</h3><div class="row"><span>Recettes</span><b>${fmt(recT)}</b></div><div class="row"><span>Dépenses</span><b class="neg">− ${fmt(depT)}</b></div><div class="row"><span>Dû au propriétaire</span><b>${fmt(due+yDue)}</b></div><div class="row"><span>Reste aux chauffeurs</span><b class="pos">${fmt(recT-depT-due-yDue)}</b></div><p class="note">${rule()}</p></div>
<div class="card"><h3>Recettes par jour · Corolla</h3><div class="bars">${wk.map(x=>`<div class="b"><i style="height:${Math.round(x[1]/mx*90)}px${x[0]==="Auj."?";background:var(--ok)":""}"></i>${x[0]}</div>`).join("")}</div></div>
<div class="card"><h3>Dépenses par catégorie · Corolla</h3>${cs.map(x=>`<div class="row" style="border:0;padding-bottom:2px"><span>${x[0]}</span><b>${fmt(x[1])}</b></div><div class="meter"><div style="width:${Math.round(x[1]/cm*100)}%"></div></div>`).join("")}</div>
<div class="card"><h3>Par véhicule</h3><div class="row"><span><b>Corolla</b> · VTC<br><small class="note">Kouassi Yao</small></span><b>${fmt(rec-dep)}</b></div><div class="row"><span><b>Yaris</b> · Taxi<br><small class="note">Traoré Ibrahim · 4 jours</small></span><b>${fmt(56000)}</b></div><p class="note">Données de démonstration. Export PDF ou Excel : à valider.</p></div>`}
const MS={signale:["t-bad","Signalé"],planifie:["t-warn","Planifié"],termine:["t-ok","Terminé"]};
function maintCard(){const o=S.role==="owner";
 return `<div class="card"><h3>Maintenance</h3>${S.maint.length?S.maint.map((x,i)=>`<div class="row"><span><b>${x.k}</b><br><small class="note">${x.v}</small></span><span style="text-align:right"><span class="tag ${MS[x.st][0]}">${MS[x.st][1]}</span>${o&&x.st!=="termine"?`<br><button class="btn ghost" data-mt="${i}" style="margin-top:6px;padding:6px 10px">${x.st==="signale"?"Planifier":"Marquer terminé"}</button>`:""}</span></div>`).join(""):'<p class="note">Aucune intervention en cours.</p>'}<h3 style="margin-top:14px">Prochaines échéances</h3><div class="row"><span>Vidange · Corolla</span><span class="tag t-warn">Dans 400 km</span></div><div class="row"><span>Contrôle pneus · H100</span><span class="tag t-ok">Dans 1 200 km</span></div><p class="note">Proposition à valider : alertes selon le kilométrage saisi par le chauffeur. Le propriétaire planifie puis clôture l’intervention.</p></div>`}
function aff(){const free=vehicles.filter(v=>v.d==="Non affecté");
 return `<div class="card"><h3>Demandes d’inscription</h3>${S.req?`<div class="row"><span><b>Diomandé Sékou</b><br><small class="note">Chauffeur · permis à vérifier</small></span><span class="tag t-warn">En attente</span></div>${free.length?`<label for="av">Affecter au véhicule</label><select id="av">${free.map(v=>`<option value="${v.p}">${v.m} ${v.p} (${TT[v.ty].n})</option>`).join("")}</select><div class="btns" style="margin-top:10px"><button class="btn sun" id="okreq">Confirmer et affecter</button><button class="btn ghost" id="norq">Refuser</button></div>`:'<p class="note">Aucun véhicule libre.</p>'}`:'<p class="note">Aucune demande en attente.</p>'}</div>
<div class="card"><h3>Chauffeurs et véhicules</h3>${vehicles.map((v,i)=>`<div class="veh"><div style="flex:1"><span class="plate">${v.p}</span><div style="margin-top:6px">${TT[v.ty].n} · <b>${v.d}</b></div>${v.ln?`<label for="ln${i}">Ligne</label><select id="ln${i}" data-ln="${i}">${LN[v.ty].map(l=>`<option ${l===v.ln?"selected":""}>${l}</option>`).join("")}</select>`:'<div class="note">Sans ligne, circule partout</div>'}</div>${v.d!=="Non affecté"?`<button class="btn ghost" data-un="${i}" style="flex:0">Retirer</button>`:""}</div>`).join("")}<p class="note">Le propriétaire choisit la ligne parmi une liste prévue. Un trajet hors ligne est signalé, pas bloqué. Chaque changement est historisé.</p></div>`}
function signup(){
 const P={owner:"Propriétaire",manager:"Gestionnaire ou comptable",driver:"Chauffeur"};
 if(S.done)return `<div class="card hero"><small>Demande envoyée</small><div class="big" style="font-size:26px">Compte en attente de vérification</div></div><div class="card"><h3>Prochaines étapes</h3><div class="row"><span>Profil</span><b>${P[S.prof]}</b></div><div class="row"><span>État</span><span class="tag t-warn">En vérification</span></div><p class="note">Proposition à valider : les documents sont vérifiés avant l’activation du compte. ${S.prof==="driver"?"Le propriétaire confirme aussi l’affectation au véhicule.":""}</p><div class="btns"><button class="btn sun" id="go">Voir l’espace ${P[S.prof]}</button><button class="btn ghost" id="again">Nouvelle inscription</button></div></div>`;
 const extra=S.prof==="owner"?`<label for="f1">Nombre de véhicules</label><input id="f1" type="number" min="1" inputmode="numeric" placeholder="3"><label for="f2">Type de transport</label><select id="f2">${Object.keys(TT).map(k=>`<option>${TT[k].n}</option>`).join("")}</select><p class="note">Pièces demandées : carte d’identité et carte grise de chaque véhicule.</p>`:S.prof==="manager"?`<label for="f1">Code du propriétaire qui vous délègue</label><input id="f1" placeholder="Ex. PROP-2048">`:`<label for="f1">Numéro de permis de conduire</label><input id="f1"><label for="f2">Code du propriétaire</label><input id="f2" placeholder="Ex. PROP-2048">`;
 return `<div class="card"><h3>Créer mon compte</h3><label for="prof">Je suis</label><select id="prof">${Object.keys(P).map(k=>`<option value="${k}" ${S.prof===k?"selected":""}>${P[k]}</option>`).join("")}</select><label for="nm">Nom complet</label><input id="nm" autocomplete="name"><label for="ph">Téléphone (+225)</label><input id="ph" type="tel" inputmode="tel" placeholder="07 00 00 00 00">${extra}<div class="btns" style="margin-top:12px"><button class="btn sun" id="sg">Envoyer la demande</button></div><p class="note">Prototype : aucune donnée n’est enregistrée. Chaque propriétaire garde un espace séparé et sécurisé.</p></div>`}
const sum=t=>S.entries.filter(e=>e.t===t).reduce((a,e)=>a+e.a,0);
function calc(){const rec=sum("recette"),car=sum("carburant"),dep=sum("depense"),net=rec-car-dep;
 const own=S.contract.mode==="fixe"?Math.min(S.contract.val,Math.max(net,0)):Math.max(net,0)*S.contract.val/100;
 return{rec,car,dep,net,own,drv:net-own}}
const stTag={brouillon:["t-warn","Brouillon"],soumise:["t-warn","À valider par le propriétaire"],validee:["t-ok","Validée"],renvoyee:["t-bad","Renvoyée pour correction"]};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function queue(){if(S.online)return;S.pending++}
function head(){
 document.getElementById("roles").innerHTML=[["signup","Inscription"],["owner","Propriétaire"],["manager","Gestionnaire"],["driver","Chauffeur"]].map(r=>`<button class="${S.role===r[0]?"on":""}" data-r="${r[0]}">${r[1]}</button>`).join("");
 const sw=document.getElementById("sw");sw.className="sw"+(S.online?" on":"");sw.firstElementChild.textContent=S.online?"Connecté":"Hors connexion";
 document.getElementById("netlbl").textContent=S.pending?`${S.pending} saisie(s) en attente de synchronisation`:(S.online?"Toutes les données sont synchronisées":"Saisie possible, envoi au retour du réseau");
 const tabs=S.role==="signup"?[["form","Inscription"]]:S.role==="owner"?[["dash","Accueil"],["veh","Véhicules"],["aff","Affectations"],["rep","Rapports"],["cont","Contrat"]]:S.role==="manager"?[["dash","Clôtures"],["veh","Véhicules"],["rep","Rapports"]]:[["day","Ma journée"],["add","Saisir"],["close","Clôture"]];
 if(!tabs.find(t=>t[0]===S.tab))S.tab=tabs[0][0];
 document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}
function summaryRows(c){return `<div class="row"><span>Recettes</span><b>${fmt(c.rec)}</b></div><div class="row"><span>Carburant</span><b class="neg">− ${fmt(c.car)}</b></div><div class="row"><span>Autres dépenses</span><b class="neg">− ${fmt(c.dep)}</b></div><div class="row"><span>Résultat de la journée</span><b>${fmt(c.net)}</b></div><div class="row"><span>Dû au propriétaire</span><b>${fmt(c.own)}</b></div><div class="row"><span>Solde résiduel du chauffeur</span><b class="pos">${fmt(c.drv)}</b></div>`}
const rule=()=>S.contract.mode==="fixe"?`Contrat : versement fixe de ${fmt(S.contract.val)} par jour`:`Contrat : ${S.contract.val} % du résultat de la journée`;
function view(){
 head();const m=document.getElementById("main"),c=calc(),st=stTag[S.status],own=S.role==="owner"||S.role==="manager";
 if(S.role==="signup"){m.innerHTML=signup()}
 else if(own&&S.tab==="dash"){
  m.innerHTML=`<div class="card hero"><small>Dû aujourd’hui pour la Corolla 5821 GH 01</small><div class="big">${fmt(c.own)}</div><small>${rule()}</small></div>
  <div class="card"><h3>Clôture de la journée</h3><div class="row"><span>Kouassi Yao</span><span class="tag ${st[0]}">${st[1]}</span></div>${summaryRows(c)}${S.validator&&S.status==="validee"?`<p class="note">Validée par ${S.validator}.</p>`:""}
  ${S.note?`<p class="note">Motif envoyé : ${S.note}</p>`:""}
  <div class="btns" style="margin-top:10px"><button class="btn sun" id="val" ${S.status!=="soumise"?"disabled":""}>Valider la clôture</button><button class="btn ghost" id="ret" ${S.status!=="soumise"?"disabled":""}>Demander une correction</button></div>
  <p class="note">Le propriétaire ou son gestionnaire peut valider. Une clôture validée est verrouillée, toute correction ultérieure est historisée.</p></div>
  <div class="card"><h3>Flotte</h3><div class="row"><span>Véhicules</span><b>4</b></div><div class="row"><span>En service</span><b>1</b></div><div class="row"><span>Alertes documents</span><b>1</b></div></div>`}
 else if(S.role==="owner"&&S.tab==="aff"){m.innerHTML=aff()}
 else if(own&&S.tab==="rep"){m.innerHTML=rep()}
 else if(own&&S.tab==="veh"){
  m.innerHTML=`<div class="card"><h3>Mes véhicules</h3>${vehicles.map(v=>`<div class="veh"><div style="flex:1"><span class="plate">${v.p}</span><div style="margin-top:6px"><b>${v.m}</b> · ${TT[v.ty].n}${v.ln?" · "+v.ln:""} · ${v.d}</div><div class="note" style="margin:2px 0 0">${v.doc}</div></div><span class="tag t-${v.s}">${v.st}</span></div>`).join("")}
  <p class="note">Chaque véhicule appartient à son propriétaire. Un chauffeur peut être affecté à plusieurs véhicules selon ses autorisations.</p></div>${maintCard()}`}
 else if(S.role==="owner"){
  m.innerHTML=`<div class="card"><h3>Règle financière du contrat</h3><label for="mode">Mode de calcul</label><select id="mode"><option value="fixe" ${S.contract.mode==="fixe"?"selected":""}>Versement fixe par jour</option><option value="pct" ${S.contract.mode==="pct"?"selected":""}>Pourcentage du résultat</option></select>
  <label for="cv">${S.contract.mode==="fixe"?"Montant par jour (FCFA)":"Part du propriétaire (%)"}</label><input id="cv" type="number" min="0" value="${S.contract.val}" inputmode="numeric">
  <p class="note">Chaque propriétaire définit sa propre règle. Le calcul du tableau de bord et de la clôture suit ce réglage.</p>
  <div class="card" style="margin:12px 0 0"><b>Aperçu aujourd’hui</b><div class="row"><span>Dû au propriétaire</span><b>${fmt(c.own)}</b></div><div class="row"><span>Solde résiduel du chauffeur</span><b>${fmt(c.drv)}</b></div></div></div>`}
 else if(S.tab==="day"){
  m.innerHTML=`<div class="card hero"><small>Véhicule affecté</small><div class="big" style="font-size:26px">Toyota Corolla</div><span class="plate">5821 GH 01</span></div>
  ${docCard()}${typeCard()}
  <div class="card"><h3>Mission</h3><div class="row"><span>État</span><span class="tag ${S.mission?"t-ok":"t-warn"}">${S.mission?"En cours":"À l’arrêt"}</span></div><div class="row"><span>Courses terminées</span><b>${S.trips}</b></div>
  <div class="btns" style="margin-top:10px"><button class="btn sun" id="mis">${S.mission?"Terminer la mission":"Démarrer la mission"}</button><button class="btn ghost" id="trip" ${S.mission?"":"disabled"}>+ 1 course</button></div></div>
  <div class="card"><h3>Ma journée</h3><div class="row"><span>Recettes</span><b>${fmt(c.rec)}</b></div><div class="row"><span>Dépenses</span><b class="neg">− ${fmt(c.car+c.dep)}</b></div><p class="note">${rule()}</p></div>`}
 else if(S.tab==="add"){
  m.innerHTML=`<div class="card"><h3>Nouvelle saisie</h3><label for="ty">Type</label><select id="ty"><option value="recette|Recette">Recette</option><optgroup label="Carburant"><option value="carburant|Essence">Essence</option><option value="carburant|Gasoil">Gasoil</option></optgroup><optgroup label="Autres dépenses"><option value="depense|Lavage">Lavage du véhicule</option><option value="depense|Parking">Parking</option><option value="depense|Péage">Péage</option><option value="depense|Crédit téléphonique">Crédit téléphonique</option><option value="depense|Réparation pneu">Réparation de pneu</option><option value="depense|Autre">Autre dépense</option></optgroup></select><label for="am">Montant (FCFA)</label><input id="am" type="number" min="0" inputmode="numeric" placeholder="5000"><label for="lb">Précision (facultatif)</label><input id="lb" placeholder="Ex. course Cocody – Plateau, station Total"><div class="btns" style="margin-top:12px"><button class="btn sun" id="ad" ${S.status==="validee"||S.status==="soumise"?"disabled":""}>Enregistrer</button></div>${S.status==="validee"||S.status==="soumise"?'<p class="note">La journée est clôturée, la saisie est verrouillée.</p>':""}</div>
  <div class="card"><h3>Signaler un problème</h3><label for="mk">Type</label><select id="mk"><option>Vidange</option><option>Pneu</option><option>Freins</option><option>Batterie</option><option>Autre panne</option></select><div class="btns" style="margin-top:10px"><button class="btn ghost" id="mt">Envoyer au propriétaire</button></div></div>
  <div class="card"><h3>Dernières saisies</h3>${S.entries.slice().reverse().map(e=>`<div class="row"><span>${e.l}</span><b class="${e.t==="recette"?"pos":"neg"}">${e.t==="recette"?"+":"−"} ${fmt(e.a)}</b></div>`).join("")}</div>`}
 else{
  m.innerHTML=`<div class="card"><h3>Clôture de la journée</h3><div class="row"><span>État</span><span class="tag ${st[0]}">${st[1]}</span></div>${summaryRows(c)}
  ${S.note?`<p class="note">Demande du propriétaire : ${S.note}</p>`:""}
  <div class="btns" style="margin-top:10px"><button class="btn sun" id="sub" ${S.status==="soumise"||S.status==="validee"?"disabled":""}>Soumettre la clôture</button></div>
  <p class="note">Le propriétaire ou son gestionnaire contrôle puis valide. Rien n’est définitif avant la validation.</p></div>`}
 bind()}
function bind(){
 const $=id=>document.getElementById(id);
 if($("val"))$("val").onclick=()=>{S.status="validee";S.note="";S.validator=S.role==="owner"?"le propriétaire":"le gestionnaire";toast("Clôture validée et verrouillée");view()};
 if($("ret"))$("ret").onclick=()=>{S.status="renvoyee";S.note="Vérifier le montant des recettes";toast("Correction demandée au chauffeur");view()};
 if($("mode"))$("mode").onchange=e=>{S.contract.mode=e.target.value;S.contract.val=e.target.value==="fixe"?15000:30;view()};
 if($("cv"))$("cv").onchange=e=>{S.contract.val=Math.max(0,+e.target.value||0);view()};
 if($("mis"))$("mis").onclick=()=>{S.mission=!S.mission;queue();toast(S.mission?"Mission démarrée":"Mission terminée");view()};
 if($("trip"))$("trip").onclick=()=>{S.trips++;queue();view()};
 if($("ad"))$("ad").onclick=()=>{const a=+$("am").value;if(!a||a<=0){toast("Saisissez un montant supérieur à 0");return}
  const [tp,cat]=$("ty").value.split("|");S.entries.push({t:tp,l:cat+($("lb").value?" – "+$("lb").value:""),a});queue();if(S.status==="renvoyee")S.status="brouillon";toast(S.online?"Saisie enregistrée":"Saisie gardée sur le téléphone");view()};
 if($("sub"))$("sub").onclick=()=>{S.status="soumise";S.note="";queue();toast("Clôture envoyée au propriétaire");view()};
 if($("tt"))$("tt").onchange=e=>{S.ttype=e.target.value;view()};
 if($("prof"))$("prof").onchange=e=>{S.prof=e.target.value;view()};
 if($("sg"))$("sg").onclick=()=>{if(!$("nm").value.trim()||!$("ph").value.trim()){toast("Renseignez le nom et le téléphone");return}S.done=true;view()};
 if($("again"))$("again").onclick=()=>{S.done=false;view()};
 if($("okreq"))$("okreq").onclick=()=>{const v=vehicles.find(x=>x.p===$("av").value);v.d="Diomandé Sékou";v.s="ok";v.st="En service";S.req=false;toast("Sékou est affecté à "+v.m);view()};
 if($("norq"))$("norq").onclick=()=>{S.req=false;toast("Demande refusée");view()};
 if($("mt"))$("mt").onclick=()=>{S.maint.push({k:$("mk").value,v:"Corolla 5821 GH 01",st:"signale"});queue();toast("Problème signalé au propriétaire");view()};
 document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{const x=S.maint[b.dataset.mt];x.st=x.st==="signale"?"planifie":"termine";toast(x.st==="planifie"?"Intervention planifiée":"Intervention terminée");view()});
 document.querySelectorAll("[data-ln]").forEach(s=>s.onchange=()=>{vehicles[s.dataset.ln].ln=s.value;toast("Ligne mise à jour");view()});
 document.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{const v=vehicles[b.dataset.un];v.d="Non affecté";v.s="warn";v.st="Disponible";toast("Affectation retirée");view()});
 if($("go"))$("go").onclick=()=>{S.role=S.prof;S.tab=S.prof==="driver"?"day":"dash";view()};
}
document.getElementById("roles").onclick=e=>{const r=e.target.dataset.r;if(r){S.role=r;S.tab=r==="signup"?"form":r==="driver"?"day":"dash";view()}};
document.getElementById("nav").onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;view()}};
document.getElementById("sw").onclick=()=>{S.online=!S.online;if(S.online&&S.pending){toast(S.pending+" saisie(s) synchronisée(s)");S.pending=0}view()};

/* --- PWA : sauvegarde locale, détection réseau, hors connexion --- */
const KEY="tm-proto-v1";
try{const sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv){Object.assign(S,sv.S);vehicles.splice(0,vehicles.length,...sv.v)}}catch(e){}
S.online=navigator.onLine;
const _view=view;
view=function(){_view();try{localStorage.setItem(KEY,JSON.stringify({S:S,v:vehicles}))}catch(e){}};
addEventListener("offline",()=>{S.online=false;view()});
addEventListener("online",()=>{S.online=true;if(S.pending){toast(S.pending+" saisie(s) synchronisée(s)");S.pending=0}view()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

view();
</script>
</body>
</html>
