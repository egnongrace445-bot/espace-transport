<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22313a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EDSP – ESPACE TRANSPORT</title>
<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#1c2429;--mute:#5d6b73;--line:#d9ded9;--road:#22313a;--sun:#f2b705;--ok:#1d7a58;--bad:#b9382b;--warn:#b7791f;--okbg:#dff1e8;--badbg:#f8e0dc;--warnbg:#fbefd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12191d;--card:#1b252b;--ink:#eaeeea;--mute:#98a7af;--line:#2d3b43;--road:#0d1316;--okbg:#17372b;--badbg:#412320;--warnbg:#3d3016;--ok:#55c595;--bad:#ef8b7f;--warn:#e8b64d}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding-bottom:40px}
header{background:var(--road);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:16px;font-weight:800}header h1 span{color:var(--sun)}
.sub{font-size:11px;letter-spacing:.14em;color:#b9c6cc;font-weight:600;margin-top:2px}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--road);color:#fff}
.btn.sun{background:var(--sun);color:#1c2429}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;min-width:110px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.06em;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;display:inline-block;margin:6px 0}
.chip{font-family:ui-monospace,Menlo,monospace;font-weight:700;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;font-size:13px;white-space:nowrap}
.seg{display:flex;gap:6px}.seg button{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--road);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90%}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>EDSP – <span>ESPACE TRANSPORT</span></h1><div class="sub">TRANSPORT MANAGER</div></div>
  <button class="btn ghost sm" id="out" hidden style="color:#fff;border-color:#ffffff55">Déconnexion</button>
</header>
<main id="main"><p class="note">Chargement…</p></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RN={owner:"Propriétaire",manager:"Gestionnaire ou comptable",driver:"Chauffeur"};
const ST={pending:["t-warn","En attente"],active:["t-ok","Actif"],suspended:["t-bad","Refusé"]};
let sb=null,user=null,profile=null,mem=[],reqs={},mode="in",busy=false,D={},tab=null;

function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}
function msg(e){const m=(e&&e.message)||String(e);
 if(/Invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";
 if(/already registered/i.test(m))return"Cette adresse e-mail a déjà un compte. Utilise « Se connecter ».";
 if(/Password should be/i.test(m))return"Mot de passe trop court (6 caractères minimum).";
 if(/rate limit/i.test(m))return"Trop d’essais. Réessaie dans quelques minutes.";
 if(/fetch|network/i.test(m))return"Pas de connexion internet.";
 return m}

async function init(){
 if(!window.supabase||!window.TM_CONFIG){$("main").innerHTML='<div class="card"><h3>Connexion impossible</h3><p class="note">Internet est nécessaire au premier lancement pour charger l’application.</p></div>';return}
 sb=supabase.createClient(TM_CONFIG.url,TM_CONFIG.key);
 sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){user=null;mem=[];reqs={};setTimeout(view,0)}});
 const r=await sb.auth.getSession();user=r.data.session?r.data.session.user:null;
 await load();
}

async function load(){
 if(!user){view();return}
 try{
  const p=await sb.from("profiles").select("full_name").eq("id",user.id).maybeSingle();profile=p.data;
  const m=await sb.from("memberships").select("id,role,status,owner_id,owners(name,code)").eq("user_id",user.id).order("created_at");
  if(m.error)throw m.error;mem=m.data||[];reqs={};
  for(const x of mem.filter(a=>a.role==="owner"&&a.status==="active")){
   const r=await sb.from("memberships").select("id,role,status,user_id,profiles(full_name)").eq("owner_id",x.owner_id).neq("user_id",user.id).order("created_at");
   reqs[x.owner_id]=r.data||[];
  }
  await loadSpace();
 }catch(e){toast(msg(e))}
 view();
}

function accView(){
 const name=(profile&&profile.full_name)||user.email;
 const hasOwner=mem.some(a=>a.role==="owner");
 let h=`<div class="card"><h3>Bonjour ${esc(name)}</h3><div class="note" style="margin:0">${esc(user.email)}</div></div>`;
 if(!mem.length)h+=`<div class="card"><h3>Bienvenue</h3><p class="note" style="margin-top:0">Choisis ton profil pour commencer.</p></div>`;
 mem.forEach(a=>{
  const o=a.owners||{},s=ST[a.status]||["t-warn",a.status];
  h+=`<div class="card"><div class="row" style="padding-top:0"><span><b>${RN[a.role]}</b><br><span class="note" style="margin:0">${esc(o.name)}</span></span><span class="tag ${s[0]}">${s[1]}</span></div>`;
  if(a.role==="owner"&&a.status==="active"){
   h+=`<div class="note" style="margin-top:4px">Code à donner à tes chauffeurs et gestionnaires :</div><div class="code">${esc(o.code)}</div>`;
   const rs=reqs[a.owner_id]||[];
   h+=`<h3 style="margin-top:10px">Demandes et équipe</h3>`;
   if(!rs.length)h+=`<p class="note" style="margin-top:0">Aucune demande pour l’instant.</p>`;
   rs.forEach(r=>{const t=ST[r.status];
    h+=`<div class="row"><span><b>${esc(r.profiles&&r.profiles.full_name||"Sans nom")}</b><br><span class="note" style="margin:0">${RN[r.role]}</span></span>`+
     (r.status==="pending"?`<span style="display:flex;gap:6px"><button class="btn sun sm" data-a="dec" data-id="${r.id}" data-v="active">Accepter</button><button class="btn ghost sm" data-a="dec" data-id="${r.id}" data-v="suspended">Refuser</button></span>`:`<span class="tag ${t[0]}">${t[1]}</span>`)+`</div>`;
   });
  }
  if(a.role!=="owner"&&a.status==="pending")h+=`<p class="note">Ta demande est envoyée. Le propriétaire doit la confirmer avant que tu accèdes à son espace.</p>`;
  if(a.status==="active"&&a.role!=="owner")h+=`<p class="note">Accès confirmé. Les véhicules, saisies et clôtures arrivent à l’étape suivante.</p>`;
  h+=`</div>`;
 });
 if(!hasOwner)h+=`<div class="card"><h3>Je suis propriétaire</h3><label for="on">Nom de ton entreprise ou activité</label><input id="on" placeholder="Ex. Transports Kouassi"><div class="btns"><button class="btn sun" data-a="own">Créer mon espace</button></div></div>`;
 h+=`<div class="card"><h3>Je rejoins un propriétaire</h3><label for="jc">Code du propriétaire</label><input id="jc" placeholder="PROP-XXXXXX" autocapitalize="characters"><label for="jr">Mon rôle</label><select id="jr"><option value="driver">Chauffeur</option><option value="manager">Gestionnaire ou comptable</option></select><div class="btns"><button class="btn sun" data-a="join">Envoyer ma demande</button></div></div>`;
 h+=`<p class="note"><a href="demo.html">Voir la démonstration</a> des écrans à venir (maintenance, rapports).</p>`;
 return h;
}


/* ===== Étape 2 : véhicules, affectations, saisies, clôtures ===== */
const CS={brouillon:["t-warn","Brouillon"],soumise:["t-warn","À valider"],validee:["t-ok","Validée"],renvoyee:["t-bad","Renvoyée"]};
const TN={vtc:"VTC",taxi:"Taxi",gbaka:"Gbaka",woro:"Wôrô-wôrô"};
const fmt=n=>Math.round(n).toLocaleString("fr-FR")+" FCFA";
const today=()=>new Date().toLocaleDateString("sv-SE");
const act=()=>mem.find(a=>a.status==="active");
function calc(es,ru){let r=0,c=0,o=0;es.forEach(e=>{if(e.entry_type==="recette")r+=e.amount;else if(e.entry_type==="carburant")c+=e.amount;else o+=e.amount});
 const net=r-c-o,due=!ru?0:ru.mode==="fixe"?Math.min(ru.value,Math.max(net,0)):Math.max(net,0)*ru.value/100;return{r,c,o,net,due,bal:net-due}}
const sumRows=s=>`<div class="row"><span>Recettes</span><b>${fmt(s.r)}</b></div><div class="row"><span>Carburant</span><b>− ${fmt(s.c)}</b></div><div class="row"><span>Autres dépenses</span><b>− ${fmt(s.o)}</b></div><div class="row"><span>Résultat</span><b>${fmt(s.net)}</b></div><div class="row"><span>Dû au propriétaire</span><b>${fmt(s.due)}</b></div><div class="row"><span>Reste au chauffeur</span><b>${fmt(s.bal)}</b></div>`;

async function loadSpace(){
 D={};const a=act();if(!a)return;const oid=a.owner_id;
 if(a.role==="driver"){
  const r=await sb.from("assignments").select("vehicle_id").eq("driver_id",user.id).is("ends_on",null);
  const vid=r.data&&r.data[0]&&r.data[0].vehicle_id;if(!vid)return;
  const q=await Promise.all([
   sb.from("vehicles").select("id,plate,model,transport_type,lines(name)").eq("id",vid).maybeSingle(),
   sb.from("contracts").select("mode,value").eq("vehicle_id",vid).is("ends_on",null).limit(1),
   sb.from("work_days").select("id").eq("vehicle_id",vid).eq("driver_id",user.id).eq("work_date",today()).maybeSingle()]);
  D.my=q[0].data;D.rule=(q[1].data||[])[0]||null;D.day=q[2].data;D.ents=[];
  if(D.day){const e=await sb.from("entries").select("id,entry_type,category,label,amount").eq("work_day_id",D.day.id).order("client_ts");D.ents=e.data||[];
   const k=await sb.from("closures").select("status,return_reason").eq("work_day_id",D.day.id).maybeSingle();D.clo=k.data}
  return;
 }
 const q=await Promise.all([
  sb.from("vehicles").select("id,plate,model,transport_type,lines(name)").eq("owner_id",oid).order("created_at"),
  sb.from("assignments").select("id,vehicle_id,driver_id,profiles(full_name)").eq("owner_id",oid).is("ends_on",null),
  sb.from("contracts").select("id,vehicle_id,mode,value").eq("owner_id",oid).is("ends_on",null),
  sb.from("memberships").select("user_id,status,profiles(full_name)").eq("owner_id",oid).eq("role","driver"),
  sb.from("closures").select("work_day_id,status,return_reason").eq("owner_id",oid),
  sb.from("work_days").select("id,work_date,vehicle_id,driver_id").eq("owner_id",oid).order("work_date",{ascending:false}).limit(30)]);
 D.veh=q[0].data||[];D.asg=q[1].data||[];D.con=q[2].data||[];
 const nm={};(q[3].data||[]).forEach(x=>nm[x.user_id]=x.profiles&&x.profiles.full_name);
 D.drv=(q[3].data||[]).filter(x=>x.status==="active");
 const cm={};(q[4].data||[]).forEach(x=>cm[x.work_day_id]=x);
 const pl={};D.veh.forEach(v=>pl[v.id]=v.plate);
 const L=[];(q[5].data||[]).forEach(w=>{const c=cm[w.id];if(c)L.push({id:w.id,date:w.work_date,plate:pl[w.vehicle_id],driver:nm[w.driver_id]||"Chauffeur",st:c.status,why:c.return_reason})});
 await Promise.all(L.map(async x=>{const r=await sb.rpc("day_summary",{p_day:x.id});const s=(r.data||[])[0]||{};
  x.s={r:+s.recettes||0,c:+s.carburant||0,o:+s.depenses||0,net:+s.net||0,due:+s.due||0,bal:+s.driver_balance||0}}));
 D.cl=L;
}

function vehView(){
 const a=act(),own=a.role==="owner",V=D.veh||[];let h="";
 if(own)h+=`<div class="card"><h3>Ajouter un véhicule</h3><label for="vp">Plaque</label><input id="vp" placeholder="5821 GH 01"><label for="vm">Modèle</label><input id="vm" placeholder="Toyota Corolla"><label for="vt">Type de transport</label><select id="vt">${Object.keys(TN).map(k=>`<option value="${k}">${TN[k]}</option>`).join("")}</select><label for="vl">Ligne (Gbaka et Wôrô-wôrô seulement)</label><input id="vl" placeholder="Ex. Yopougon – Adjamé"><div class="btns"><button class="btn sun" data-a="addveh">Ajouter</button></div></div>`;
 if(!V.length)h+=`<div class="card"><p class="note" style="margin:0">Aucun véhicule pour l’instant.</p></div>`;
 V.forEach((v,i)=>{const as=(D.asg||[]).find(x=>x.vehicle_id===v.id),co=(D.con||[]).find(x=>x.vehicle_id===v.id);
  h+=`<div class="card"><div class="row" style="padding-top:0"><span class="chip">${esc(v.plate)}</span><span class="note" style="margin:0">${esc(v.model||"")} · ${TN[v.transport_type]}${v.lines?" · "+esc(v.lines.name):""}</span></div>`;
  h+=`<div class="row"><span>Chauffeur</span><span>`+(as?`<b>${esc(as.profiles&&as.profiles.full_name||"—")}</b>`+(own?` <button class="btn ghost sm" data-a="unasg" data-id="${as.id}">Retirer</button>`:""):(own&&(D.drv||[]).length?`<select id="as${i}" style="width:auto"><option value="">Choisir…</option>${D.drv.map(d=>`<option value="${d.user_id}">${esc(d.profiles&&d.profiles.full_name||"Chauffeur")}</option>`).join("")}</select> <button class="btn sun sm" data-a="asg" data-v="${v.id}" data-i="${i}">Affecter</button>`:`<span class="note" style="margin:0">Non affecté</span>`))+`</span></div>`;
  h+=own?`<label for="cm${i}">Contrat</label><div class="seg"><select id="cm${i}"><option value="fixe" ${co&&co.mode==="fixe"?"selected":""}>Versement fixe (FCFA / jour)</option><option value="pourcentage" ${co&&co.mode==="pourcentage"?"selected":""}>Pourcentage (%)</option></select><input id="cv${i}" type="number" min="0" value="${co?co.value:""}" placeholder="Valeur"></div><div class="btns"><button class="btn ghost sm" data-a="con" data-v="${v.id}" data-i="${i}">Enregistrer le contrat</button></div>`:`<div class="row"><span>Contrat</span><b>${co?(co.mode==="fixe"?fmt(co.value)+" / jour":co.value+" %"):"—"}</b></div>`;
  h+=`</div>`});
 return h;
}

function cloView(){
 const L=D.cl||[];
 return `<div class="card"><h3>Clôtures des journées</h3>${L.length?"":'<p class="note" style="margin:0">Aucune clôture envoyée pour l’instant.</p>'}</div>`+L.map(x=>{const t=CS[x.st];
  return `<div class="card"><div class="row" style="padding-top:0"><span><b>${esc(x.date)}</b> · <span class="chip">${esc(x.plate)}</span><br><span class="note" style="margin:0">${esc(x.driver)}</span></span><span class="tag ${t[0]}">${t[1]}</span></div>${x.why?`<p class="note">Renvoi : ${esc(x.why)}</p>`:""}${sumRows(x.s)}${x.st==="soumise"?`<div class="btns"><button class="btn sun" data-a="rev" data-id="${x.id}" data-v="1">Valider</button><button class="btn ghost" data-a="rev" data-id="${x.id}" data-v="0">Renvoyer</button></div>`:""}</div>`}).join("");
}

function dayView(){
 if(!D.my)return `<div class="card"><h3>Ma journée</h3><p class="note" style="margin-top:0">Aucun véhicule ne t’est affecté pour l’instant. Demande à ton propriétaire de t’affecter un véhicule.</p></div>`;
 const v=D.my,ru=D.rule;
 let h=`<div class="card"><div class="row" style="padding-top:0"><span class="chip">${esc(v.plate)}</span><span class="note" style="margin:0">${esc(v.model||"")} · ${TN[v.transport_type]}${v.lines?" · "+esc(v.lines.name):""}</span></div><p class="note" style="margin-bottom:0">${ru?(ru.mode==="fixe"?"Versement fixe : "+fmt(ru.value)+" par jour":"Part du propriétaire : "+ru.value+" % du résultat"):"Aucun contrat défini pour ce véhicule."}</p></div>`;
 if(!D.day)return h+`<div class="card"><h3>Aujourd’hui</h3><div class="btns"><button class="btn sun" data-a="start">Commencer la journée</button></div></div>`;
 const st=D.clo?D.clo.status:"brouillon",open=st==="brouillon"||st==="renvoyee",t=CS[st];
 h+=`<div class="card"><div class="row" style="padding-top:0"><h3 style="margin:0">Aujourd’hui</h3><span class="tag ${t[0]}">${t[1]}</span></div>${D.clo&&D.clo.return_reason?`<p class="note">Motif du renvoi : ${esc(D.clo.return_reason)}</p>`:""}`;
 h+=(D.ents.length?D.ents.map(e=>`<div class="row"><span>${esc(e.category)}${e.label?" – "+esc(e.label):""}</span><b>${e.entry_type==="recette"?"+":"−"} ${fmt(e.amount)}</b></div>`).join(""):`<p class="note">Aucune saisie.</p>`)+sumRows(calc(D.ents,ru))+`</div>`;
 if(open)h+=`<div class="card"><h3>Nouvelle saisie</h3><label for="et">Type</label><select id="et"><option value="recette|Recette">Recette</option><optgroup label="Carburant"><option value="carburant|Essence">Essence</option><option value="carburant|Gasoil">Gasoil</option></optgroup><optgroup label="Autres dépenses"><option value="depense|Lavage">Lavage du véhicule</option><option value="depense|Parking">Parking</option><option value="depense|Péage">Péage</option><option value="depense|Crédit téléphonique">Crédit téléphonique</option><option value="depense|Réparation pneu">Réparation de pneu</option><option value="depense|Autre">Autre dépense</option></optgroup></select><label for="ea">Montant (FCFA)</label><input id="ea" type="number" min="1" inputmode="numeric"><label for="el">Précision (facultatif)</label><input id="el"><div class="btns"><button class="btn sun" data-a="addent">Enregistrer</button><button class="btn ghost" data-a="submit">Envoyer la clôture</button></div></div>`;
 return h;
}

function view(){
 $("out").hidden=!user;
 if(!user){$("main").innerHTML=authView();return}
 const a=act(),T=!a?[["acc","Compte"]]:a.role==="driver"?[["day","Ma journée"],["acc","Compte"]]:a.role==="owner"?[["veh","Véhicules"],["clo","Clôtures"],["acc","Compte"]]:[["clo","Clôtures"],["veh","Véhicules"],["acc","Compte"]];
 if(!T.some(x=>x[0]===tab))tab=T[0][0];
 const nav=T.length>1?`<div class="seg" style="margin-bottom:12px">${T.map(x=>`<button class="btn ${tab===x[0]?"":"ghost"}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`:"";
 $("main").innerHTML=nav+(tab==="veh"?vehView():tab==="clo"?cloView():tab==="day"?dayView():accView());
}

function authView(){
 const up=mode==="up";
 return `<div class="card"><div class="seg"><button class="btn ${up?"ghost":""}" data-a="mode" data-v="in">Se connecter</button><button class="btn ${up?"":"ghost"}" data-a="mode" data-v="up">Créer un compte</button></div>
 ${up?'<label for="fn">Nom complet</label><input id="fn" autocomplete="name">':""}
 <label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email">
 <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="6 caractères minimum">
 <div class="btns"><button class="btn sun" data-a="${up?"signup":"signin"}">${up?"Créer mon compte":"Me connecter"}</button></div>
 <p class="note">Phase de test : la connexion se fait par e-mail. Le code SMS viendra plus tard.</p></div>`;
}

async function run(btn,fn){
 if(busy)return;busy=true;if(btn)btn.disabled=true;
 try{await fn()}catch(e){toast(msg(e))}
 busy=false;if(btn)btn.disabled=false;
}

$("main").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="mode"){mode=b.dataset.v;view();return}
 if(a==="tab"){tab=b.dataset.v;view();return}
 run(b,async()=>{
  if(a==="signin"||a==="signup"){
   const em=$("em").value.trim(),pw=$("pw").value;
   if(!em||!pw){toast("Renseigne l’e-mail et le mot de passe.");return}
   if(a==="signup"){
    const fn=$("fn").value.trim();if(!fn){toast("Renseigne ton nom.");return}
    const r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:fn}}});
    if(r.error)throw r.error;
    if(!r.data.session){toast("Compte créé. Confirme ton e-mail puis connecte-toi.");mode="in";view();return}
    user=r.data.session.user;
   }else{
    const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)throw r.error;user=r.data.user;
   }
   await load();
  }else if(a==="own"){
   const n=$("on").value.trim();if(!n){toast("Renseigne le nom de ton entreprise.");return}
   const r=await sb.rpc("create_owner",{p_name:n});if(r.error)throw r.error;
   toast("Espace créé.");await load();
  }else if(a==="join"){
   const c=$("jc").value.trim();if(!c){toast("Renseigne le code du propriétaire.");return}
   const r=await sb.rpc("join_owner",{p_code:c,p_role:$("jr").value});if(r.error)throw r.error;
   toast("Demande envoyée.");await load();
  }else if(a==="dec"){
   const r=await sb.from("memberships").update({status:b.dataset.v}).eq("id",b.dataset.id).select();
   if(r.error)throw r.error;if(!r.data.length)throw new Error("Action refusée.");
   toast(b.dataset.v==="active"?"Demande acceptée.":"Demande refusée.");await load();
  }else if(a==="addveh"){
   const o=act().owner_id,pl=$("vp").value.trim(),ty=$("vt").value,ln=$("vl").value.trim();let lid=null;
   if(!pl){toast("Renseigne la plaque.");return}
   if(ty==="gbaka"||ty==="woro"){if(!ln){toast("Renseigne la ligne.");return}
    const q=await sb.from("lines").select("id").eq("owner_id",o).eq("name",ln).eq("transport_type",ty).limit(1);lid=q.data&&q.data[0]&&q.data[0].id;
    if(!lid){const i=await sb.from("lines").insert({owner_id:o,name:ln,transport_type:ty}).select("id").single();if(i.error)throw i.error;lid=i.data.id}}
   const r=await sb.from("vehicles").insert({owner_id:o,plate:pl,model:$("vm").value.trim()||null,transport_type:ty,line_id:lid});if(r.error)throw r.error;
   toast("Véhicule ajouté.");await load();
  }else if(a==="asg"){
   const dr=$("as"+b.dataset.i).value;if(!dr){toast("Choisis un chauffeur.");return}
   const r=await sb.from("assignments").insert({owner_id:act().owner_id,vehicle_id:b.dataset.v,driver_id:dr,confirmed_by:user.id});if(r.error)throw r.error;
   toast("Chauffeur affecté.");await load();
  }else if(a==="unasg"){
   const r=await sb.from("assignments").update({ends_on:today()}).eq("id",b.dataset.id);if(r.error)throw r.error;
   toast("Affectation retirée.");await load();
  }else if(a==="con"){
   const i=b.dataset.i,mo=$("cm"+i).value,val=+$("cv"+i).value;
   if(!(val>=0)||$("cv"+i).value===""||(mo==="pourcentage"&&val>100)){toast("Valeur du contrat invalide.");return}
   const ex=(D.con||[]).find(c=>c.vehicle_id===b.dataset.v);
   const r=ex?await sb.from("contracts").update({mode:mo,value:val}).eq("id",ex.id):await sb.from("contracts").insert({owner_id:act().owner_id,vehicle_id:b.dataset.v,mode:mo,value:val});
   if(r.error)throw r.error;toast("Contrat enregistré.");await load();
  }else if(a==="start"){
   const r=await sb.from("work_days").insert({owner_id:act().owner_id,vehicle_id:D.my.id,driver_id:user.id,work_date:today()});if(r.error)throw r.error;
   await load();
  }else if(a==="addent"){
   const p=$("et").value.split("|"),am=Math.round(+$("ea").value);if(!(am>0)){toast("Montant invalide.");return}
   const r=await sb.from("entries").insert({id:crypto.randomUUID(),work_day_id:D.day.id,entry_type:p[0],category:p[1],label:$("el").value.trim()||null,amount:am});if(r.error)throw r.error;
   toast("Saisie enregistrée.");await load();
  }else if(a==="submit"){
   if(!confirm("Envoyer la clôture ? Tu ne pourras plus modifier la journée."))return;
   const r=await sb.rpc("submit_closure",{p_day:D.day.id});if(r.error)throw r.error;toast("Clôture envoyée.");await load();
  }else if(a==="rev"){
   const ok=b.dataset.v==="1";let why=null;
   if(!ok){why=prompt("Motif du renvoi (obligatoire) :");if(!why||!why.trim())return}
   const r=await sb.rpc("review_closure",{p_day:b.dataset.id,p_approve:ok,p_reason:why});if(r.error)throw r.error;
   toast(ok?"Clôture validée.":"Clôture renvoyée.");await load();
  }
 });
});
$("out").onclick=()=>run($("out"),async()=>{await sb.auth.signOut();user=null;mem=[];view()});

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
init();
</script>
</body>
</html>
