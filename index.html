<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03326E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EDSP – ESPACE TRANSPORT</title>
<style>
:root{--bg:#f1f4f1;--card:#fff;--ink:#1b2a24;--mute:#5a6b63;--line:#d8e0da;--brand:#03326E;--brand2:#01478D;--sun:#97D010;--okbg:#dcf3e8;--badbg:#fbe1dc;--warnbg:#fdecd0;--ok:#0b7a4b;--bad:#b8352a;--warn:#a85f00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231e;--ink:#e9f0ec;--mute:#9db0a6;--line:#2a3a32;--brand:#021f45;--brand2:#033a75;--okbg:#14382a;--badbg:#42221e;--warnbg:#41300f;--ok:#55c595;--bad:#ef8b7f;--warn:#f0b955}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding-bottom:40px}
header{background:linear-gradient(100deg,var(--brand) 0%,var(--brand2) 60%,#228B33 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--sun)}
header img{width:42px;height:42px;flex:none;border-radius:10px;background:#fff}
header .t{flex:1;min-width:0}header h1{font-size:16px;font-weight:800;line-height:1.15}header h1 span{color:#c6ee74}
.sub{font-size:11px;letter-spacing:.16em;color:#cfe0ff;font-weight:600;margin-top:2px}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.neg{color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.sun{background:var(--sun);color:#0f1f00}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;min-width:110px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.06em;background:var(--bg);border:1px dashed var(--sun);border-radius:10px;padding:8px 12px;display:inline-block;margin:6px 0}
.chip{font-family:ui-monospace,Menlo,monospace;font-weight:700;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;font-size:13px;white-space:nowrap}
.seg{display:flex;gap:6px}.seg>*{flex:1}
.nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.nav .btn{white-space:nowrap;flex:none;padding:9px 12px;font-size:14px}
.big{font-size:30px;font-weight:800;line-height:1.1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%;box-shadow:0 4px 14px #0004}
#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--brand),var(--brand2) 62%,#228B33);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 8px 30px #0006;animation:pop .8s ease-out}
#splash h2{margin:20px 0 0;font-size:22px;color:#fff;font-weight:800}#splash h2 span{color:#c6ee74}
#splash p{letter-spacing:.3em;font-size:12px;margin:6px 0 0;color:#d4f3a0;font-weight:700}
@keyframes pop{from{transform:scale(.6) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div id="splash"></div>
<div class="app">
<header><span id="hl"></span><div class="t"><h1>EDSP – <span>ESPACE TRANSPORT</span></h1><div class="sub">TRANSPORT MANAGER</div></div><button class="btn ghost sm" id="out" hidden style="color:#fff;border-color:#ffffff88">Déconnexion</button></header>
<main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString("fr-FR")+" FCFA";
const today=()=>new Date().toLocaleDateString("sv-SE");
const dl=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
const RN={owner:"Propriétaire",fleet_manager:"Gestionnaire de flotte",accountant:"Comptable",technician:"Technicien",driver:"Chauffeur"};
const TN={vtc:"VTC",taxi:"Taxi",gbaka:"Gbaka",woro:"Wôrô-wôrô"};
const CAT={essence:"Essence",gasoil:"Gasoil",lavage:"Lavage",parking:"Parking",peage:"Péage",credit_telephonique:"Crédit téléphonique",pneu:"Pneu",reparation:"Réparation",gare_syndicat:"Gare ou syndicat",autre:"Autre dépense"};
const DOCT={assurance:"Assurance",visite_technique:"Visite technique",carte_grise:"Carte grise",autorisation_transport:"Autorisation de transport",autre:"Autre document"};
const CS={draft:["t-warn","Brouillon"],submitted:["t-warn","À valider"],validated:["t-ok","Validée"],returned:["t-bad","Renvoyée"]};
const MS={reported:["t-bad","Signalé"],planned:["t-warn","Planifié"],in_progress:["t-warn","En cours"],done:["t-ok","Terminé"],cancelled:["t-bad","Annulé"]};
const NEXT={reported:"planned",planned:"in_progress",in_progress:"done"},NEXTL={reported:"Planifier",planned:"Démarrer",in_progress:"Terminé"};
const tag=a=>`<span class="tag ${a[0]}">${a[1]}</span>`;
const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option value="${x[0]}"${x[0]===v?" selected":""}>${x[1]}</option>`).join("")}</select>`;
const card=(t,b)=>`<div class="card">${t?`<h3>${t}</h3>`:""}${b}</div>`;
const none=t=>`<p class="note" style="margin:0">${t}</p>`;
const uid=()=>crypto.randomUUID();

let sb=null,user=null,mems=[],bid=null,roles=[],P=new Set(),D={},tab=null,mode="in",busy=false,isPA=false;
const can=p=>P.has(p),isDrv=()=>roles.includes("driver");
const QK="tm-queue2",qget=()=>{try{return JSON.parse(localStorage.getItem(QK)||"[]")}catch(e){return[]}},qset=q=>{try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}};
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}
function msg(e){const m=(e&&e.message)||String(e);
 if(/Invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";
 if(/already registered/i.test(m))return"Cette adresse e-mail a déjà un compte.";
 if(/Password should be/i.test(m))return"Mot de passe trop court (6 caractères minimum).";
 if(/rate limit/i.test(m))return"Trop d’essais. Réessaie dans quelques minutes.";
 if(/duplicate key/i.test(m))return"Cet élément existe déjà.";
 if(/fetch|network/i.test(m))return"Pas de connexion internet.";
 if(/row-level security/i.test(m))return"Action non autorisée pour ton rôle.";
 return m}
async function flush(){const q=qget();if(!q.length||!navigator.onLine||!sb)return;let left=[];
 for(const t of ["revenues","expenses"]){const rows=q.filter(x=>x.t===t).map(x=>x.row);if(!rows.length)continue;
  const r=await sb.from(t).upsert(rows,{onConflict:"id",ignoreDuplicates:true});if(r.error)left=left.concat(q.filter(x=>x.t===t))}
 qset(left);if(left.length<q.length)toast((q.length-left.length)+" saisie(s) envoyée(s).")}

async function init(){
 $("splash").innerHTML='<img src="icon-512.png" alt="EDSP"><h2>EDSP – <span>ESPACE TRANSPORT</span></h2><p>TRANSPORT MANAGER</p>';
 $("hl").innerHTML='<img src="icon-192.png" alt="EDSP">';
 const t0=Date.now(),hide=()=>setTimeout(()=>$("splash").classList.add("off"),Math.max(0,1300-(Date.now()-t0)));
 if(!window.supabase||!window.TM_CONFIG){$("main").innerHTML=card("Connexion impossible",none("Internet est nécessaire au premier lancement."));hide();return}
 sb=supabase.createClient(TM_CONFIG.url,TM_CONFIG.key);
 sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){user=null;mems=[];bid=null;D={};setTimeout(view,0)}});
 const r=await sb.auth.getSession();user=r.data.session?r.data.session.user:null;
 await flush();await load();hide();
}

async function load(){
 if(!user){view();return}
 try{
  const m=await sb.from("business_memberships").select("id,business_id,role,status,business_accounts(name,code)").eq("user_id",user.id).order("created_at");
  if(m.error)throw m.error;mems=m.data||[];
  const act=mems.filter(x=>x.status==="active"),sv=localStorage.getItem("tm-biz");
  bid=((act.find(x=>x.business_id===sv)||act[0])||{}).business_id||null;
  roles=act.filter(x=>x.business_id===bid).map(x=>x.role);P=new Set();D={};
  if(bid){const p=await sb.from("role_permissions").select("permission").in("role",roles);(p.data||[]).forEach(x=>P.add(x.permission));
   if(P.size)await loadStaff();if(isDrv())await loadDrv()}
  const pa=await sb.from("platform_admins").select("user_id").eq("user_id",user.id).maybeSingle();isPA=!!pa.data;
  if(isPA){const q=await Promise.all([sb.from("business_accounts").select("id,name,code,verification_status,suspended,created_at").order("created_at",{ascending:false}),sb.from("business_memberships").select("business_id,role,status")]);
   D.pb=q[0].data||[];D.pc={};(q[1].data||[]).forEach(x=>{const t=D.pc[x.business_id]=D.pc[x.business_id]||{n:0,p:0};if(x.status==="active")t.n++;else if(x.status==="pending")t.p++})}
  try{localStorage.setItem("tm-snap2",JSON.stringify({u:user.id,mems,bid,roles,P:[...P],D}))}catch(e){}
 }catch(e){try{const s=JSON.parse(localStorage.getItem("tm-snap2")||"null");if(s&&s.u===user.id){mems=s.mems;bid=s.bid;roles=s.roles;P=new Set(s.P);D=s.D}}catch(x){}toast(msg(e))}
 view();
}

async function loadStaff(){
 const q=(t,c)=>sb.from(t).select(c).eq("business_id",bid),vr=can("vehicle.read");
 const r=await Promise.all([
  can("member.read")?q("business_memberships","id,user_id,role,status,profiles(full_name)"):null,
  vr?q("vehicles","id,plate,make,model,transport_type,status,line_id"):null,
  vr?q("transport_lines","id,name,transport_type"):null,
  vr?q("vehicle_assignments","id,vehicle_id,driver_id").is("ends_on",null):null,
  can("contract.read")?q("contracts","id,vehicle_id,mode,period,fixed_amount,percentage,rest_days_per_week,carry_over_arrears").is("ends_on",null):null,
  can("document.read")?q("documents","id,target_id,doc_type,expires_on").eq("target_type","vehicle"):null,
  (can("finance.read")||can("settlement.review"))?q("settlements","shift_id,status,net,due_owner,driver_balance,return_reason,submitted_at").order("submitted_at",{ascending:false}).limit(30):null,
  can("ledger.read")?q("ledger_entries","driver_id,amount"):null,
  can("payment.record")?q("payments","id,driver_id,kind,method,amount").is("acknowledged_at",null):null,
  can("maintenance.read")?q("maintenance_orders","id,vehicle_id,kind,status,release_decision").order("created_at",{ascending:false}).limit(20):null]);
 const v=i=>(r[i]&&r[i].data)||[];
 D.mem=v(0);D.veh=v(1);D.lines=v(2);D.asg=v(3);D.con=v(4);D.docs=v(5);D.set=v(6);D.led=v(7);D.pay=v(8);D.mnt=v(9);D.sh={};
 if(D.set.length){const s=await sb.from("shifts").select("id,shift_date,vehicle_id,driver_id").in("id",D.set.map(x=>x.shift_id));(s.data||[]).forEach(x=>D.sh[x.id]=x)}
}
async function loadDrv(){
 const a=await sb.from("vehicle_assignments").select("vehicle_id").eq("driver_id",user.id).eq("business_id",bid).is("ends_on",null);
 const vid=a.data&&a.data[0]&&a.data[0].vehicle_id;
 const L=await Promise.all([sb.from("ledger_entries").select("amount").eq("driver_id",user.id).eq("business_id",bid),
  sb.from("payments").select("id,kind,amount,acknowledged_at").eq("driver_id",user.id).eq("business_id",bid).order("paid_at",{ascending:false}).limit(10)]);
 D.dBal=(L[0].data||[]).reduce((s,x)=>s+(+x.amount),0);D.dPay=L[1].data||[];D.my=null;
 if(!vid)return;
 const q=await Promise.all([
  sb.from("vehicles").select("id,plate,make,model,transport_type,line_id").eq("id",vid).maybeSingle(),
  sb.from("contracts").select("mode,period,fixed_amount,percentage,rest_days_per_week,carry_over_arrears").eq("vehicle_id",vid).is("ends_on",null).limit(1),
  sb.from("documents").select("doc_type,expires_on").eq("target_type","vehicle").eq("target_id",vid),
  sb.from("shifts").select("id").eq("vehicle_id",vid).eq("driver_id",user.id).eq("shift_date",today()).maybeSingle()]);
 D.my=q[0].data;D.rule=(q[1].data||[])[0]||null;D.ddocs=q[2].data||[];D.shift=q[3].data;D.line=null;D.rev=[];D.exp=[];D.st=null;
 if(D.my&&D.my.line_id){const l=await sb.from("transport_lines").select("name").eq("id",D.my.line_id).maybeSingle();D.line=l.data}
 if(D.shift){const w=await Promise.all([sb.from("revenues").select("id,amount,source").eq("shift_id",D.shift.id).order("received_at"),
  sb.from("expenses").select("id,category,amount,status,note").eq("shift_id",D.shift.id).order("spent_at"),
  sb.from("settlements").select("status,return_reason").eq("shift_id",D.shift.id).maybeSingle()]);
  D.rev=w[0].data||[];D.exp=w[1].data||[];D.st=w[2].data}
}

/* ---------- calculs ---------- */
function dueOf(net,r){if(!r)return 0;
 const fx=r.mode==="percentage"?0:(r.period==="week"?r.fixed_amount/Math.max(7-(r.rest_days_per_week||0),1):r.fixed_amount);
 const raw=r.mode==="fixed"?fx:r.mode==="percentage"?Math.max(net,0)*r.percentage/100:fx+Math.max(net-fx,0)*r.percentage/100;
 return r.carry_over_arrears?raw:Math.min(raw,Math.max(net,0))}
const docRows=l=>l.map(d=>{const j=d.expires_on?dl(d.expires_on):null,t=j===null?["t-warn","Sans date"]:j<0?["t-bad","Expiré"]:j<=5?["t-warn","Dans "+j+" j"]:["t-ok","Valide"];
 return `<div class="row"><span>${DOCT[d.doc_type]||esc(d.doc_type)}<br><span class="note" style="margin:0">${d.expires_on?"échéance "+d.expires_on.split("-").reverse().join("/"):""}</span></span>${tag(t)}</div>`}).join("");
const nameOf=u=>{const m=(D.mem||[]).find(x=>x.user_id===u);return(m&&m.profiles&&m.profiles.full_name)||"Membre"};
const plateOf=id=>{const v=(D.veh||[]).find(x=>x.id===id);return v?v.plate:""};

/* ---------- écrans ---------- */
function authView(){const up=mode==="up";
 return card("",`<div class="seg"><button class="btn ${up?"ghost":""}" data-a="mode" data-v="in">Se connecter</button><button class="btn ${up?"":"ghost"}" data-a="mode" data-v="up">Créer un compte</button></div>
 ${up?'<label for="fn">Nom complet</label><input id="fn" autocomplete="name">':""}
 <label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email">
 <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="6 caractères minimum">
 <div class="btns"><button class="btn sun" data-a="${up?"signup":"signin"}">${up?"Créer mon compte":"Me connecter"}</button></div>
 <p class="note">Phase de test : connexion par e-mail. Le code SMS viendra plus tard.</p>`)}

function tabsList(){const T=[];
 if(bid){
  if(P.size){const pn=(D.mem||[]).filter(x=>x.status==="pending").length;
   T.push(["eq","Équipe"+(pn&&can("member.manage")?" ("+pn+")":"")]);
   if(can("vehicle.read"))T.push(["fl","Flotte"]);
   if(can("settlement.review")||can("finance.read"))T.push(["cl","Clôtures"]);
   if(can("ledger.read"))T.push(["cp","Comptes"]);
   if(can("maintenance.read"))T.push(["en","Entretien"]);}
  if(isDrv())T.push(["jr","Ma journée"],["mc","Mon compte"],["sg","Signaler"]);}
 if(isPA)T.push(["pa","Plateforme"]);T.push(["pf","Profil"],["ap","À propos"]);return T}

function view(){
 $("out").hidden=!user;
 if(!user){$("main").innerHTML=tab==="ap"?aproposView()+'<div class="btns"><button class="btn ghost" data-a="tab" data-v="in">Retour</button></div>':authView()+'<p class="note" style="text-align:center"><a href="#" data-a="tab" data-v="ap">À propos</a></p>';return}
 const T=tabsList();if(!T.some(x=>x[0]===tab))tab=T[0][0];
 const F={eq:equipe,fl:flotte,cl:clotures,cp:comptes,en:entretien,pa:plateforme,ap:aproposView,jr:journee,mc:monCompte,sg:signaler,pf:profil};
 $("main").innerHTML=(T.length>1?`<div class="nav">${T.map(x=>`<button class="btn ${tab===x[0]?"":"ghost"}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`:"")+F[tab]();
}

function equipe(){
 const b=(mems.find(x=>x.business_id===bid&&x.status==="active")||{}).business_accounts||{};
 const M=D.mem||[],pend=M.filter(x=>x.status==="pending"),act=M.filter(x=>x.status==="active");
 const free=(D.veh||[]).filter(v=>!(D.asg||[]).some(a=>a.vehicle_id===v.id));
 let h=card(esc(b.name),can("member.manage")?`<div class="note" style="margin-top:0">Code à donner à ton équipe :</div><div class="code">${esc(b.code)}</div>`:none("Espace de l’entreprise."));
 h+=card("Demandes",pend.length?pend.map(r=>`<div class="row"><span><b>${esc(nameOf(r.user_id))}</b><br><span class="note" style="margin:0">${RN[r.role]}</span></span>`+(can("member.manage")?`<span class="col">${r.role==="driver"&&can("assignment.write")&&free.length?sel("fv"+r.id,free.map(v=>[v.id,v.plate]))+`<button class="btn sun sm" data-a="accasg" data-id="${r.id}" data-u="${r.user_id}">Accepter et affecter</button>`:`<button class="btn sun sm" data-a="acc" data-id="${r.id}" data-v="active">Accepter</button>`}<button class="btn ghost sm" data-a="acc" data-id="${r.id}" data-v="suspended">Refuser</button></span>`:"")+`</div>`).join(""):none("Aucune demande."));
 h+=card("Équipe",act.map(r=>`<div class="row"><span>${esc(nameOf(r.user_id))}</span>${tag(["t-ok",RN[r.role]])}</div>`).join("")||none("—"));
 return h}

function flotte(){
 const V=D.veh||[],drv=(D.mem||[]).filter(x=>x.role==="driver"&&x.status==="active");let h="";
 if(can("vehicle.write"))h+=card("Ajouter un véhicule",`<label for="vp">Plaque</label><input id="vp" placeholder="5821 GH 01"><label for="vk">Marque</label><input id="vk" placeholder="Toyota"><label for="vm">Modèle</label><input id="vm" placeholder="Corolla"><label for="vt">Type de transport</label>${sel("vt",Object.keys(TN).map(k=>[k,TN[k]]))}<label for="vf">Carburant</label>${sel("vf",[["","—"],["essence","Essence"],["gasoil","Gasoil"],["hybride","Hybride"],["electrique","Électrique"]])}<label for="vl">Ligne (Gbaka et Wôrô-wôrô seulement)</label><input id="vl" placeholder="Ex. Yopougon – Adjamé"><div class="btns"><button class="btn sun" data-a="addveh">Ajouter</button></div>`);
 if(!V.length)h+=card("",none("Aucun véhicule pour l’instant."));
 V.forEach((v,i)=>{const as=(D.asg||[]).find(x=>x.vehicle_id===v.id),co=(D.con||[]).find(x=>x.vehicle_id===v.id),ln=(D.lines||[]).find(x=>x.id===v.line_id);
  let c=`<div class="row" style="padding-top:0"><span class="chip">${esc(v.plate)}</span><span class="note" style="margin:0">${esc([v.make,v.model].filter(Boolean).join(" "))} · ${TN[v.transport_type]}${ln?" · "+esc(ln.name):""}</span></div>`;

function journee(){
 if(!D.my)return card("Ma journée",none("Aucun véhicule ne t’est affecté pour l’instant. Demande à ton propriétaire de t’affecter un véhicule."));
 const v=D.my,ru=D.rule,qs=qget().filter(x=>D.shift&&x.row.shift_id===D.shift.id);
 let h=card("",`<div class="row" style="padding-top:0"><span class="chip">${esc(v.plate)}</span><span class="note" style="margin:0">${esc([v.make,v.model].filter(Boolean).join(" "))} · ${TN[v.transport_type]}${D.line?" · "+esc(D.line.name):""}</span></div><p class="note" style="margin-bottom:0">${ru?(ru.mode==="fixed"?"Versement fixe : "+fmt(ru.fixed_amount)+(ru.period==="week"?" par semaine":" par jour"):ru.mode==="percentage"?"Part du propriétaire : "+ru.percentage+" % du résultat":"Fixe "+fmt(ru.fixed_amount)+" + "+ru.percentage+" % du surplus"):"Aucun contrat défini pour ce véhicule."}</p>`);
 const al=(D.ddocs||[]).filter(d=>d.expires_on&&dl(d.expires_on)<=5);
 if((D.ddocs||[]).length)h+=`<div class="card"${al.length?' style="border-color:var(--sun)"':""}><h3>Documents du véhicule</h3>${al.length?`<p class="note" style="margin:0 0 6px;color:var(--warn)"><b>Rappel :</b> à renouveler bientôt.</p>`:""}${docRows(D.ddocs)}</div>`;
 if(!D.shift)return h+card("Aujourd’hui",`<label for="sk">Kilométrage de départ (facultatif)</label><input id="sk" type="number" min="0" inputmode="numeric"><div class="btns"><button class="btn sun" data-a="start">Commencer la journée</button></div>`);
 const st=D.st?D.st.status:"draft",open=st==="draft"||st==="returned";
 const R=D.rev.concat(qs.filter(x=>x.t==="revenues").map(x=>x.row)),E=D.exp.concat(qs.filter(x=>x.t==="expenses").map(x=>x.row));
 const g=R.reduce((s,x)=>s+x.amount,0),e=E.filter(x=>x.status!=="rejected").reduce((s,x)=>s+x.amount,0),net=g-e,due=dueOf(net,ru);
 const lines=R.map(x=>`<div class="row"><span>Recette${x.source&&x.source!=="course"?" ("+esc(x.source)+")":""}${x.id&&qs.some(q=>q.row.id===x.id)?" · en attente":""}</span><b>+ ${fmt(x.amount)}</b></div>`).concat(E.map(x=>`<div class="row"><span>${esc(CAT[x.category]||x.category)}${x.note?" – "+esc(x.note):""}${x.status==="rejected"?" · rejetée":""}${qs.some(q=>q.row.id===x.id)?" · en attente":""}</span><b>− ${fmt(x.amount)}</b></div>`));
 h+=card("",`<div class="row" style="padding-top:0"><h3 style="margin:0">Aujourd’hui</h3>${tag(CS[st])}</div>${D.st&&D.st.return_reason?`<p class="note">Motif du renvoi : ${esc(D.st.return_reason)}</p>`:""}${lines.join("")||none("Aucune saisie.")}<div class="row"><span>Résultat</span><b>${fmt(net)}</b></div><div class="row"><span>Dû au propriétaire</span><b>${fmt(due)}</b></div><div class="row"><span>Reste pour toi</span><b>${fmt(net-due)}</b></div>`);
 if(open)h+=card("Nouvelle saisie",`<label for="et">Type</label><select id="et"><optgroup label="Recette"><option value="rev|course">Recette (course)</option><option value="rev|tour">Recette (tour de ligne)</option><option value="rev|autre">Autre recette</option></optgroup><optgroup label="Dépenses">${Object.keys(CAT).map(k=>`<option value="exp|${k}">${CAT[k]}</option>`).join("")}</optgroup></select><label for="ea">Montant (FCFA)</label><input id="ea" type="number" min="1" inputmode="numeric"><label for="el">Précision (facultatif)</label><input id="el"><div class="btns"><button class="btn sun" data-a="ent">Enregistrer</button><button class="btn ghost" data-a="sub">Envoyer la clôture</button></div>`);
 return h}

/* ---------- actions ---------- */
async function run(btn,fn){if(busy)return;busy=true;if(btn)btn.disabled=true;try{await fn()}catch(e){toast(msg(e))}busy=false;if(btn)btn.disabled=false}
const ok=(r,m)=>{if(r.error)throw r.error;if(m)toast(m)};
$("main").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;if(b.tagName==="A")e.preventDefault();const a=b.dataset.a,d=b.dataset,v=id=>$(id).value;
 if(a==="mode"){mode=d.v;view();return}
 if(a==="tab"){tab=d.v;view();return}
 run(b,async()=>{
  if(a==="signin"||a==="signup"){
   const em=v("em").trim(),pw=v("pw");if(!em||!pw){toast("Renseigne l’e-mail et le mot de passe.");return}
   if(a==="signup"){const fn=v("fn").trim();if(!fn){toast("Renseigne ton nom.");return}
    const r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:fn}}});if(r.error)throw r.error;
    if(!r.data.session){toast("Compte créé. Confirme ton e-mail puis connecte-toi.");mode="in";view();return}user=r.data.session.user}
   else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;user=r.data.user}
   await load();return}
  if(a==="nb"){const n=v("on").trim();if(!n){toast("Renseigne le nom de ton entreprise.");return}ok(await sb.rpc("create_business",{p_name:n}),"Espace créé.");tab=null;await load();return}
  if(a==="jb"){const c=v("jc").trim();if(!c){toast("Renseigne le code du propriétaire.");return}ok(await sb.rpc("join_business",{p_code:c,p_role:v("jr")}),"Demande envoyée.");await load();return}
  if(a==="bv"){const r=await sb.from("business_accounts").update({verification_status:d.v}).eq("id",d.id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error("Action refusée.");toast("Statut mis à jour.");await load();return}
  if(a==="bs"){if(d.v==="1"&&!confirm("Suspendre cette entreprise ? Plus personne ne pourra y accéder."))return;const r=await sb.from("business_accounts").update({suspended:d.v==="1"}).eq("id",d.id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error("Action refusée.");toast(d.v==="1"?"Entreprise suspendue.":"Entreprise réactivée.");await load();return}
  if(a==="sw"){localStorage.setItem("tm-biz",d.v);tab=null;await load();return}
  if(a==="acc"){const r=await sb.from("business_memberships").update({status:d.v}).eq("id",d.id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error("Action refusée.");toast(d.v==="active"?"Demande acceptée.":"Demande refusée.");await load();return}
  if(a==="accasg"){const r1=await sb.from("business_memberships").update({status:"active"}).eq("id",d.id).select();if(r1.error)throw r1.error;if(!r1.data.length)throw new Error("Action refusée.");
   ok(await sb.from("vehicle_assignments").insert({business_id:bid,vehicle_id:v("fv"+d.id),driver_id:d.u,confirmed_by:user.id}),"Chauffeur accepté et affecté.");await load();return}
  if(a==="addveh"){const pl=v("vp").trim(),ty=v("vt"),ln=v("vl").trim();let lid=null;if(!pl){toast("Renseigne la plaque.");return}
   if(ty==="gbaka"||ty==="woro"){if(!ln){toast("Renseigne la ligne.");return}
    const q=await sb.from("transport_lines").select("id").eq("business_id",bid).eq("name",ln).eq("transport_type",ty).limit(1);lid=q.data&&q.data[0]&&q.data[0].id;
    if(!lid){const i=await sb.from("transport_lines").insert({business_id:bid,name:ln,transport_type:ty}).select("id").single();if(i.error)throw i.error;lid=i.data.id}}
   ok(await sb.from("vehicles").insert({business_id:bid,plate:pl,make:v("vk").trim()||null,model:v("vm").trim()||null,transport_type:ty,fuel_type:v("vf")||null,line_id:lid}),"Véhicule ajouté.");await load();return}
  if(a==="asg"){const dr=v("as"+d.i);if(!dr){toast("Choisis un chauffeur.");return}ok(await sb.from("vehicle_assignments").insert({business_id:bid,vehicle_id:d.v,driver_id:dr,confirmed_by:user.id}),"Chauffeur affecté.");await load();return}
  if(a==="unasg"){ok(await sb.from("vehicle_assignments").update({ends_on:today()}).eq("id",d.id),"Affectation retirée.");await load();return}
  if(a==="con"){const i=d.i,mo=v("cm"+i),fx=v("cf"+i),pc=v("cp"+i);
   if(mo!=="percentage"&&!(fx!==""&&+fx>=0)||mo!=="fixed"&&!(pc!==""&&+pc>=0&&+pc<=100)){toast("Montant ou pourcentage invalide.");return}
   const row={mode:mo,period:v("cd"+i),fixed_amount:mo==="percentage"?null:+fx,percentage:mo==="fixed"?null:+pc,rest_days_per_week:+v("cr"+i)||0,carry_over_arrears:$("cc"+i).checked},ex=(D.con||[]).find(c=>c.vehicle_id===d.v);
   ok(ex?await sb.from("contracts").update(row).eq("id",ex.id):await sb.from("contracts").insert(Object.assign({business_id:bid,vehicle_id:d.v},row)),"Contrat enregistré.");await load();return}
  if(a==="adddoc"){const dt=v("dd"+d.i);if(!dt){toast("Choisis la date d’échéance.");return}
   ok(await sb.from("documents").insert({business_id:bid,target_type:"vehicle",target_id:d.v,doc_type:v("dt"+d.i),expires_on:dt,uploaded_by:user.id}),"Document ajouté.");await load();return}
  if(a==="rv"){const yes=d.v==="1";let why=null;if(!yes){why=prompt("Motif du renvoi (obligatoire) :");if(!why||!why.trim())return}
   ok(await sb.rpc("review_settlement",{sid:d.id,approve:yes,reason:why}),yes?"Clôture validée.":"Clôture renvoyée.");await load();return}
  if(a==="cfp"){const r=await sb.from("payments").update({acknowledged_at:new Date().toISOString(),received_by:user.id}).eq("id",d.id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error("Action refusée.");toast("Versement confirmé.");await load();return}
  if(a==="rp"){const am=Math.round(+v("ra"));if(!(am>0)){toast("Montant invalide.");return}const dr=v("rd");
   ok(await sb.from("payments").insert({id:uid(),business_id:bid,driver_id:dr,kind:d.k,method:v("rm"),amount:am,paid_by:d.k==="owner_payment"?dr:user.id}),d.k==="owner_payment"?"Versement enregistré.":"Avance enregistrée.");await load();return}
  if(a==="mn"){ok(await sb.from("maintenance_orders").update({status:d.v}).eq("id",d.id));await load();return}
  if(a==="rl"){ok(await sb.from("maintenance_orders").update({release_decision:d.v}).eq("id",d.id));
   if(can("vehicle.write"))await sb.from("vehicles").update({status:d.v==="released"?"available":"immobilised"}).eq("id",d.u);toast("Décision enregistrée.");await load();return}
  if(a==="start"){const k=v("sk");ok(await sb.from("shifts").insert({business_id:bid,vehicle_id:D.my.id,driver_id:user.id,shift_date:today(),started_at:new Date().toISOString(),start_km:k?+k:null}));await load();return}
  if(a==="ent"){const p=v("et").split("|"),am=Math.round(+v("ea"));if(!(am>0)){toast("Montant invalide.");return}const note=v("el").trim()||null;
   const it=p[0]==="rev"?{t:"revenues",row:{id:uid(),business_id:bid,shift_id:D.shift.id,amount:am,source:p[1]}}:{t:"expenses",row:{id:uid(),business_id:bid,shift_id:D.shift.id,vehicle_id:D.my.id,category:p[1],amount:am,note:note,created_by:user.id}};
   let good=navigator.onLine;if(good){const r=await sb.from(it.t).insert(it.row);if(r.error){if(/fetch|network/i.test(r.error.message))good=false;else throw r.error}}
   if(!good){qset(qget().concat(it));toast("Pas de réseau : saisie gardée sur le téléphone.");view();return}
   toast("Saisie enregistrée.");await load();return}
  if(a==="sub"){if(!confirm("Envoyer la clôture ? Tu ne pourras plus modifier la journée."))return;
   await flush();if(qget().length){toast("Des saisies attendent le réseau. Réessaie quand il revient.");return}
   ok(await sb.rpc("submit_settlement",{sid:D.shift.id}),"Clôture envoyée.");await load();return}
  if(a==="dp"){const am=Math.round(+v("da"));if(!(am>0)){toast("Montant invalide.");return}
   ok(await sb.from("payments").insert({id:uid(),business_id:bid,driver_id:user.id,kind:"owner_payment",method:v("dm"),amount:am,paid_by:user.id}),"Versement déclaré.");await load();return}
  if(a==="rpt"){ok(await sb.from("maintenance_orders").insert({business_id:bid,vehicle_id:D.my.id,kind:v("mk"),reported_by:user.id}),"Problème signalé.");return}
  if(a==="inc"){ok(await sb.from("incidents").insert({business_id:bid,vehicle_id:D.my.id,type:v("it"),severity:+v("is"),description:v("ix").trim()||null,reported_by:user.id}),"Incident déclaré.");return}
 });
});
$("out").onclick=()=>run($("out"),async()=>{await sb.auth.signOut();user=null;mems=[];bid=null;D={};view()});

addEventListener("offline",()=>toast("Hors connexion : tes saisies seront gardées sur le téléphone."));
addEventListener("online",()=>flush().then(load));
setInterval(()=>{if(!user||busy||document.hidden||!navigator.onLine)return;const f=document.activeElement;if(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName))return;
 if([...document.querySelectorAll("#main input")].some(i=>i.type!=="checkbox"&&i.value!==i.defaultValue))return;load()},15000);
addEventListener("visibilitychange",()=>{if(!document.hidden&&user&&!busy)load()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
init();
</script>
</body>
</html>
